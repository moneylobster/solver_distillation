[project]
name = "solver-distillation"
version = "0.1.0"
description = "Reimplementation of 'Linear Multistep Solver Distillation for Fast Sampling of Diffusion Models' (ICLR 2025)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.7",
    # EDM / diff-sampler requirements (from NVlabs/edm environment.yml)
    "numpy>=1.20",
    "click>=8.0",
    "pillow>=8.3.1",
    "scipy>=1.7.1",
    "psutil",
    "requests",
    "tqdm",
    "imageio",
    "imageio-ffmpeg>=0.4.3",
    "matplotlib>=3.10.9",
    "pytest>=9.0.3",
    "torchvision>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dlms"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
